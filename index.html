<style>
:root{--bg:#070b18;--card:#111a35;--card2:#16214a;--line:#25315c;--tx:#eef2ff;--mut:#94a0c6;--up:#22c55e;--down:#f43f5e;--gold:#fbbf24;--a1:#22d3ee;--a2:#a78bfa;--r:20px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
body{background:radial-gradient(1100px 620px at 0% -10%,rgba(56,90,220,.28),transparent 60%),radial-gradient(900px 560px at 110% 0%,rgba(139,92,246,.22),transparent 60%),radial-gradient(800px 500px at 50% 120%,rgba(34,211,238,.12),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--tx)}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--mut)}.gold{color:var(--gold)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* Layout */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(var(--safe-t) + 0px) calc(var(--safe-r) + 0px) calc(84px + var(--safe-b)) calc(var(--safe-l) + 0px)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:linear-gradient(180deg,rgba(7,11,24,.92),rgba(7,11,24,.7));border-bottom:1px solid rgba(37,49,92,.6);padding-top:var(--safe-t)}
.topin{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo .mk{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;box-shadow:0 6px 20px rgba(34,211,238,.35)}
.logo .mk svg{width:20px;height:20px;stroke:#071026;stroke-width:2.6}
.grad{background:linear-gradient(90deg,#7dd3fc,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:120px}
.clock .t{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
.clock .t b{color:var(--tx)}
.bar{height:5px;border-radius:9px;background:rgba(148,163,184,.15);overflow:hidden;width:120px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width 1s linear}
.pillw{display:none;padding:7px 12px;border-radius:12px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);font-weight:700}
.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid rgba(37,49,92,.5);font-size:12.5px;color:var(--mut);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .in{display:inline-block;padding:6px 0;animation:tick 70s linear infinite}
.ticker span{margin-right:34px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b));background:rgba(9,14,32,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;color:var(--mut);font-size:11px;font-weight:600}
.nb svg{width:23px;height:23px}
.nb.on{color:var(--tx)}
.nb.on svg{stroke:url(#gr);filter:drop-shadow(0 2px 8px rgba(34,211,238,.45))}
svg.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){
  .side{display:flex;flex-direction:column;gap:6px;width:230px;padding:22px 14px;position:sticky;top:0;height:100vh;border-right:1px solid rgba(37,49,92,.6);background:rgba(9,14,32,.5)}
  .side .logo{padding:0 10px 18px}
  .side .nb{flex:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:14.5px}
  .side .nb.on{background:linear-gradient(90deg,rgba(34,211,238,.14),rgba(167,139,250,.08));}
  .bottom,.top .logo{display:none}
  .main{padding-bottom:30px}
  .pillw{display:block}
  .clock{margin-left:0}
  .topin{justify-content:space-between}
}
/* Karten */
.view{padding:16px 0 10px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
@media(min-width:900px){.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.card{background:linear-gradient(180deg,rgba(22,33,74,.75),rgba(15,22,50,.85));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:0}
.card h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:8px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(167,139,250,.18) 60%,rgba(22,33,74,.8));}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 70%)}
.big{font-size:clamp(30px,7vw,44px);font-weight:800;letter-spacing:-.03em;margin:2px 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:13px;background:rgba(148,163,184,.12)}
.chip.up{background:rgba(34,197,94,.14)}.chip.down{background:rgba(244,63,94,.14)}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;font-weight:700;background:rgba(148,163,184,.12);border:1px solid var(--line);transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#22d3ee,#818cf8);color:#06102a;border:0;box-shadow:0 8px 24px rgba(34,211,238,.28)}
.btn.buy{background:linear-gradient(135deg,#22c55e,#14b8a6);color:#04210f;border:0}
.btn.sell{background:linear-gradient(135deg,#f43f5e,#fb7185);color:#2a0610;border:0}
.btn.sm{padding:7px 11px;border-radius:11px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(148,163,184,.08);border:1px solid var(--line)}
.seg button{flex:1;padding:7px 10px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:rgba(148,163,184,.16);color:var(--tx)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(37,49,92,.55);cursor:pointer;border-radius:12px;transition:background .15s}
.li:last-child{border-bottom:0}
.li:hover{background:rgba(148,163,184,.06)}
.av{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:20px;background:rgba(148,163,184,.12)}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--mut)}
.r{text-align:right}
.risk{display:inline-flex;gap:2px;vertical-align:middle}
.risk i{width:6px;height:6px;border-radius:2px;background:rgba(148,163,184,.25)}
.risk i.on{background:var(--gold)}
.spark{width:84px;height:30px;flex:none}
@media(max-width:420px){.spark{display:none}}
canvas.chart{width:100%;height:220px;display:block;touch-action:pan-y}
@media(min-width:900px){canvas.chart{height:280px}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--mut);font-weight:600}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(7,11,24,.6);outline:none;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.inp.lg{font-size:22px;font-weight:700;text-align:center}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:rgba(7,11,24,.35);border:1px solid rgba(37,49,92,.7);border-radius:14px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--mut)}.stat .v{font-weight:700;margin-top:2px}
.prog{height:10px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f97316);transition:width .6s}
.legend{display:flex;flex-direction:column;gap:7px;font-size:13px}
.legend .row{gap:8px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty .e{font-size:40px;margin-bottom:6px}
.pageh{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.pageh h2{margin:0;font-size:22px;letter-spacing:-.02em}
.back{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(148,163,184,.1);border:1px solid var(--line)}
.medal{width:34px;text-align:center;font-weight:800;color:var(--mut)}
.me{background:linear-gradient(90deg,rgba(34,211,238,.12),transparent)!important}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:rgba(148,163,184,.14);color:var(--mut);margin-left:6px;vertical-align:middle}
.tag.you{background:rgba(34,211,238,.18);color:#7dd3fc}
/* Quiz */
.qcard{text-align:center;padding:28px 18px}
.qword{font-size:clamp(26px,7vw,40px);font-weight:800;letter-spacing:-.02em;margin:10px 0 18px;word-break:break-word}
.fb{margin-top:12px;padding:12px;border-radius:14px;font-weight:600}
.fb.ok{background:rgba(34,197,94,.14);color:#86efac}.fb.bad{background:rgba(244,63,94,.14);color:#fda4af}
.coin{position:fixed;z-index:80;font-weight:800;color:var(--gold);font-size:22px;pointer-events:none;animation:coin 1.2s ease-out forwards;text-shadow:0 2px 10px rgba(251,191,36,.6)}
@keyframes coin{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-90px) scale(1.25)}}
table.voc{width:100%;border-collapse:collapse}
table.voc td{padding:4px 3px}
table.voc input{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(7,11,24,.6)}
/* Modal & Toast */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(3,6,16,.65);backdrop-filter:blur(4px)}
#modal.on{display:flex}
@media(min-width:700px){#modal{align-items:center}}
.mbox{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:linear-gradient(180deg,#172352,#0f1838);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 18px calc(18px + var(--safe-b));animation:up .25s ease}
@media(min-width:700px){.mbox{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mbox h2{margin:0 0 12px;font-size:20px}
#toasts{position:fixed;z-index:70;left:50%;top:calc(12px + var(--safe-t));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:420px}
.toast{padding:11px 16px;border-radius:14px;background:rgba(22,33,74,.97);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:600;font-size:14px;animation:up .25s ease}
.toast.ok{border-color:rgba(34,197,94,.5)}.toast.err{border-color:rgba(244,63,94,.6)}
/* Willkommen */
.welcome{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px calc(24px + var(--safe-b))}
.wbox{width:100%;max-width:440px;text-align:center}
.wbox .mk{width:72px;height:72px;border-radius:22px;margin:0 auto 14px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;box-shadow:0 14px 40px rgba(34,211,238,.4)}
.wbox .mk svg{width:42px;height:42px;stroke:#071026;stroke-width:2.6}
.wbox h1{font-size:34px;margin:0 0 6px;letter-spacing:-.03em}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0;text-align:left;font-size:13px}
.feat div{padding:10px 12px;border-radius:14px;background:rgba(148,163,184,.08);border:1px solid var(--line)}
.prof{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(148,163,184,.08);border:1px solid var(--line);margin-bottom:8px;text-align:left;width:100%}
details.acc{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;background:rgba(7,11,24,.3)}
details.acc summary{cursor:pointer;font-weight:700}
details.acc p{margin:8px 0 2px;color:var(--mut);font-size:14px}
.hint{font-size:12.5px;color:var(--mut)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(148,163,184,.3);border-top-color:var(--a1);animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.flash-up{animation:fu .8s}.flash-down{animation:fd .8s}
@keyframes fu{0%{color:#4ade80;text-shadow:0 0 12px rgba(74,222,128,.6)}}
@keyframes fd{0%{color:#fb7185;text-shadow:0 0 12px rgba(251,113,133,.6)}}
.badge-online{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.badge-online.on{background:rgba(34,197,94,.14);color:#86efac}.badge-online.off{background:rgba(148,163,184,.14);color:var(--mut)}
.mt{margin-top:14px}.mb0{margin-bottom:0}
#updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;background:rgba(15,23,52,.96);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5);font-weight:600;font-size:14px;max-width:calc(100vw - 24px)}
select.inp{appearance:auto}
@media(min-width:900px){#updbar{bottom:24px}}
</style>

const IDX={};ASSETS.forEach((a,i)=>IDX[a.sym]=i);

function h32(a,b,c){
  let x=Math.imul((a|0)^0x9e3779b9,0x85ebca6b)^Math.imul((b|0)+0x632be5ab,0xc2b2ae35)^Math.imul((c|0)+0x27d4eb2f,0x165667b1);
  x^=x>>>15;x=Math.imul(x,0x2c1b3c6d);x^=x>>>12;x=Math.imul(x,0x297a2d39);x^=x>>>15;return(x>>>0)/4294967296;
}
function gauss(a,b,c){const u=Math.max(1e-12,h32(a,b,c)),v=h32(a+77,b,c+7919);return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const CL=ASSETS.map(()=>[]),SHOCK=[];let computedTo=-HIST-1;
function ensure(D){
  for(let d=computedTo+1;d<=D;d++){
    const zm=gauss(1,d,11),hc=h32(2,d,13);let shock=0;
    if(hc<0.003)shock=-(0.04+h32(3,d,17)*0.07);else if(hc>0.995)shock=0.025+h32(4,d,19)*0.04;
    SHOCK[d+HIST]=shock;
    ASSETS.forEach((a,i)=>{
      const prev=d===-HIST?a.base:CL[i][d-1+HIST],m=a.mu/YEAR,s=a.vol/Math.sqrt(YEAR);
      const z=a.rho*zm+Math.sqrt(1-a.rho*a.rho)*gauss(i+100,d,23);
      CL[i][d+HIST]=Math.max(0.01,prev*Math.exp(m-s*s/2+s*z+a.beta*shock));
    });
    computedTo=d;
  }
}
function closeP(i,d){if(d<-HIST)return ASSETS[i].base;ensure(d);return CL[i][d+HIST];}
const PATH=new Map();
function path(i,d){
  const k=i*1e7+d;let p=PATH.get(k);if(p)return p;
  const a=ASSETS[i],c0=closeP(i,d-1),c1=closeP(i,d),L=Math.log(c1/c0),s=a.vol/Math.sqrt(YEAR),W=[0];
  for(let j=1;j<=TICKS;j++)W[j]=W[j-1]+gauss(i+300,d,1000+j)/Math.sqrt(TICKS);
  p=new Float64Array(TICKS+1);
  for(let j=0;j<=TICKS;j++)p[j]=Math.log(c0)+(j/TICKS)*L+s*0.9*(W[j]-(j/TICKS)*W[TICKS]);
  if(PATH.size>4000)PATH.clear();PATH.set(k,p);return p;
}
function priceAt(i,t){
  const d=dayOf(t),f=fracOf(t)*TICKS,j=Math.floor(f),w=f-j,p=path(i,d);
  return Math.exp(j>=TICKS?p[TICKS]:p[j]*(1-w)+p[j+1]*w);
}
const price=sym=>priceAt(IDX[sym],now());
function dayChange(i,t){const d=dayOf(t);return priceAt(i,t)/closeP(i,d-1)-1;}
function seriesFor(i,range){
  const t=now(),d=dayOf(t),pts=[];
  if(range==='1T'){
    const p=path(i,d),fr=fracOf(t)*TICKS;
    pts.push({v:closeP(i,d-1),l:'Tagesbeginn'});
    for(let j=1;j<=Math.floor(fr);j++)pts.push({v:Math.exp(p[j]),l:clockStr(d,j/TICKS)});
    pts.push({v:priceAt(i,t),l:'jetzt'});
  }else{
    const n=range==='7T'?7:range==='30T'?30:YEAR;
    for(let k=d-n;k<d;k++)pts.push({v:closeP(i,k),l:'Tag '+k});
    pts.push({v:priceAt(i,t),l:'jetzt'});
  }
  return pts;
}
function clockStr(d,frac){const m=Math.floor(frac*1440);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')+' Uhr';}

/* ================================================================ Vermögen */
function savNow(sav,d){return sav.bal*Math.pow(1+SAV_R,Math.max(0,d-sav.day));}
function holdVal(h,t){let v=0;for(const s in h){const i=IDX[s];if(i!=null)v+=h[s].qty*priceAt(i,t);}return v;}
function worth(st,t){t=t||now();return st.cash+holdVal(st.holdings,t)+savNow(st.sav,dayOf(t));}
function worthPublic(e,t){ // Ranglisten-Eintrag: {cash, hold:{SYM:qty}, savBal, savDay}
  t=t||now();let v=e.cash||0;const h=e.hold||{};
  for(const s in h){const i=IDX[s];if(i!=null)v+=(+h[s]||0)*priceAt(i,t);}
  return v+(e.savBal||0)*Math.pow(1+SAV_R,Math.max(0,dayOf(t)-(e.savDay||0)));
}
function worthHistory(st,n){
  const t=now(),cur=dayOf(t),from=dayOf(st.created),start=Math.max(from,cur-n);
  const tx=st.tx.slice().sort((a,b)=>a.t-b.t);let k=0,cash=0,sav=0,sd=from;const hold={};const pts=[];
  const acc=td=>{sav*=Math.pow(1+SAV_R,Math.max(0,td-sd));sd=td;};
  for(let d=from;d<=cur;d++){
    const end=d===cur?t:dayStart(d+1)-1;
    while(k<tx.length&&tx[k].t<=end){
      const x=tx[k++],td=dayOf(x.t);
      if(x.type==='snap'){cash=x.cash;sav=x.sav;sd=x.savDay;for(const s in hold)delete hold[s];Object.assign(hold,x.hold);}
      else if(x.type==='start'||x.type==='quiz')cash+=x.amount;
      else if(x.type==='buy'){cash-=x.amount+FEE;hold[x.sym]=(hold[x.sym]||0)+x.qty;}
      else if(x.type==='sell'){cash+=x.amount-FEE;hold[x.sym]=(hold[x.sym]||0)-x.qty;}
      else if(x.type==='dep'){acc(td);cash-=x.amount;sav+=x.amount;}
      else if(x.type==='wd'){acc(td);sav-=x.amount;cash+=x.amount;}
    }
    if(d>=start){
      let v=cash+sav*Math.pow(1+SAV_R,Math.max(0,d-sd));
      for(const s in hold){const i=IDX[s];if(i!=null&&hold[s]>0)v+=hold[s]*(d===cur?priceAt(i,t):closeP(i,d));}
      pts.push({v,l:d===cur?'jetzt':'Tag '+d});
    }
  }
  return pts;
}
function compactTx(st){
  if(st.tx.length<=3000)return;
  st.tx.sort((a,b)=>a.t-b.t);
  const old=st.tx.slice(0,2000),last=old[old.length-1];
  const tmp={created:st.created,tx:old};
  // Zustand nach den alten Buchungen nachrechnen
  let cash=0,sav=0,sd=dayOf(st.created);const hold={};
  old.forEach(x=>{const td=dayOf(x.t);
    if(x.type==='snap'){cash=x.cash;sav=x.sav;sd=x.savDay;for(const s in hold)delete hold[s];Object.assign(hold,x.hold);}
    else if(x.type==='start'||x.type==='quiz')cash+=x.amount;
    else if(x.type==='buy'){cash-=x.amount+FEE;hold[x.sym]=(hold[x.sym]||0)+x.qty;}
    else if(x.type==='sell'){cash+=x.amount-FEE;hold[x.sym]=(hold[x.sym]||0)-x.qty;}
    else if(x.type==='dep'){sav*=Math.pow(1+SAV_R,td-sd);sd=td;cash-=x.amount;sav+=x.amount;}
    else if(x.type==='wd'){sav*=Math.pow(1+SAV_R,td-sd);sd=td;sav-=x.amount;cash+=x.amount;}});
  void tmp;
  st.tx=[{t:last.t,type:'snap',cash,sav,savDay:sd,hold}].concat(st.tx.slice(2000));
}

function fbErr(e){
  const c=(e&&e.code)||'';
  if(c.includes('email-already-in-use'))return'Dieser Name ist schon vergeben.';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return'Name oder Passwort falsch.';
  if(c.includes('weak-password'))return'Das Passwort braucht mindestens 6 Zeichen.';
  if(c.includes('network'))return'Keine Internetverbindung.';
  if(c.includes('too-many-requests'))return'Zu viele Versuche – kurz warten.';
  return'Fehler: '+((e&&e.message)||c||'unbekannt');
}

function go(v,arg){
  S.view=v;S.arg=arg||null;

  if(location.hash.slice(1)!==h){try{history.replaceState(null,'','#'+h);}catch(_){location.hash=h;}}

  const h=(location.hash||'').slice(1);

  else if(['depot','markt','vokabeln','rangliste','profil','abfrage','wecker'].includes(h)){S.view=h==='abfrage'?'vokabeln':h;}

/* ================================================================ Live-Aktualisierung */
let lastDay=dayOf(now()),lastVals={};
function updateLive(force){
  const t=now(),d=dayOf(t),f=fracOf(t);
  if(d!==lastDay){lastDay=d;renderTicker();if(S.view!=='abfrage'&&!document.activeElement.matches('input,textarea')){renderView();return;}}
  $$('[data-l]').forEach(el=>{
    const k=el.getAttribute('data-l'),p=k.split(':');let txt=null,cls=null;
    switch(p[0]){
      case'day':txt='Tag '+d;break;
      case'clock':txt=clockStr(d,f);break;
      case'prog':el.style.width=(f*100).toFixed(1)+'%';return;
      case'next':{const s=Math.ceil((1-f)*DAY_MS/1000);txt=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');break;}
      case'worth':if(!ST)return;txt=fmtE(worth(ST,t));break;
      case'worthchg':{if(!ST)return;const w=worth(ST,t),c=w/START-1;txt=fmtP(c)+' seit Start';cls=c>=0?'up':'down';break;}
      case'todaychg':{if(!ST)return;let a=0,b=0;for(const s in ST.holdings){const i=IDX[s];a+=ST.holdings[s].qty*priceAt(i,t);b+=ST.holdings[s].qty*closeP(i,d-1);}
        const c=b?a/b-1:0;txt=(a-b>=0?'+':'−')+fmtE(Math.abs(a-b))+' ('+fmtP(c)+') heute';cls=c>=0?'chip up':'chip down';break;}
      case'price':txt=fmtE(priceAt(IDX[p[1]],t));break;
      case'chg':{const c=dayChange(IDX[p[1]],t);txt=fmtP(c);cls=(el.classList.contains('chip')?'chip ':'')+(c>=0?'up':'down');break;}
      case'hval':{const h=ST&&ST.holdings[p[1]];if(!h)return;txt=fmtE(h.qty*priceAt(IDX[p[1]],t));break;}
      case'hpl':{const h=ST&&ST.holdings[p[1]];if(!h)return;const v=h.qty*priceAt(IDX[p[1]],t),c=h.cost?v/h.cost-1:0;txt=fmtP(c);cls='sub '+(c>=0?'up':'down');break;}
      case'sav':if(!ST)return;txt=fmtE(savNow(ST.sav,d));break;
      case'cash':if(!ST)return;txt=fmtE(ST.cash);break;
      case'earn':if(!ST)return;txt=fmtE(earnToday(),0)+' / '+fmtE(DAILY_CAP,0);break;
      case'earnbar':if(!ST)return;el.style.width=(earnToday()/DAILY_CAP*100)+'%';return;
      default:return;
    }
    if(txt!=null&&el.textContent!==txt){
      if(p[0]==='price'&&!force){const old=lastVals[k];const nv=priceAt(IDX[p[1]],t);if(old!=null&&Math.abs(nv-old)/old>0.0004){el.classList.remove('flash-up','flash-down');void el.offsetWidth;el.classList.add(nv>old?'flash-up':'flash-down');}lastVals[k]=nv;}
      el.textContent=txt;
    }
    if(cls!=null)el.className=cls+(el.classList.contains('num')?' num':'')+(el.classList.contains('flash-up')?' flash-up':'')+(el.classList.contains('flash-down')?' flash-down':'');
  });
}
let liveN=0;
setInterval(()=>{
  if(!ST)return;liveN++;updateLive(false);checkAlerts();checkOrders();
  if(S.mode==='local'&&liveN%30===0&&((ST.alerts&&ST.alerts.some(a=>!a.fired))||(ST.orders&&ST.orders.some(o=>!o.done))))save();
  if(S.view==='aktie')drawAssetChart();
  if(S.view==='depot'&&liveN%5===0)drawWorthChart();
  if(S.view==='rangliste'&&liveN%5===0&&!S.rank.loading)renderRankList();
  if(S.view==='rangliste'&&now()-S.rank.at>60000&&!S.rank.loading)fetchRanking();
},1000);

/* ================================================================ Charts */
function drawLine(cv,pts,opt){
  if(!cv)return;opt=opt||{};cv._pts=pts;cv._opt=opt;
  const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),W=Math.max(10,r.width),H=Math.max(10,r.height);
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const c=cv.getContext('2d');if(!c)return;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  if(!pts||pts.length<2){c.fillStyle='#94a0c6';c.font='13px Inter,system-ui';c.textAlign='center';c.fillText('Noch zu wenig Daten – warte ein paar Spieltage.',W/2,H/2);return;}
  const color=opt.color||'#22d3ee';let mn=Infinity,mx=-Infinity;
  for(const p of pts){if(p.v<mn)mn=p.v;if(p.v>mx)mx=p.v;}
  if(opt.base!=null){mn=Math.min(mn,opt.base);mx=Math.max(mx,opt.base);}
  const pad=(mx-mn)*0.12||Math.abs(mx)*0.01||1;mn-=pad;mx+=pad;
  const L=4,R=W-4,T=12,B=H-20,X=i=>L+(R-L)*i/(pts.length-1),Y=v=>B-(B-T)*(v-mn)/(mx-mn);
  c.strokeStyle='rgba(148,163,184,.10)';c.lineWidth=1;
  for(let k=0;k<=3;k++){const y=T+(B-T)*k/3;c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke();}
  if(opt.base!=null){c.setLineDash([4,5]);c.strokeStyle='rgba(148,163,184,.4)';c.beginPath();c.moveTo(L,Y(opt.base));c.lineTo(R,Y(opt.base));c.stroke();c.setLineDash([]);}
  const g=c.createLinearGradient(0,T,0,B);g.addColorStop(0,hexA(color,.38));g.addColorStop(1,hexA(color,0));
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.v)):c.moveTo(X(i),Y(p.v)));c.lineTo(R,B);c.lineTo(L,B);c.closePath();c.fillStyle=g;c.fill();
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.v)):c.moveTo(X(i),Y(p.v)));c.strokeStyle=color;c.lineWidth=2.4;c.lineJoin='round';c.stroke();
  const lx=X(pts.length-1),ly=Y(pts[pts.length-1].v);
  c.fillStyle=hexA(color,.25);c.beginPath();c.arc(lx,ly,8+Math.sin(now()/300)*1.5,0,7);c.fill();c.fillStyle=color;c.beginPath();c.arc(lx,ly,3.8,0,7);c.fill();
  c.fillStyle='rgba(148,160,198,.9)';c.font='11px Inter,system-ui';c.textAlign='left';c.fillText(pts[0].l||'',L,H-5);c.textAlign='right';c.fillText(pts[pts.length-1].l||'',R,H-5);
  const hv=cv._hover;
  if(hv!=null){
    const i=clamp(Math.round((hv-L)/(R-L)*(pts.length-1)),0,pts.length-1),x=X(i),y=Y(pts[i].v),fmt=opt.fmt||fmtE;
    c.strokeStyle='rgba(226,232,240,.35)';c.beginPath();c.moveTo(x,T);c.lineTo(x,B);c.stroke();
    c.fillStyle='#fff';c.beginPath();c.arc(x,y,4.5,0,7);c.fill();
    const s1=fmt(pts[i].v),s2=pts[i].l||'';c.font='600 12px Inter,system-ui';const w=Math.max(c.measureText(s1).width,c.measureText(s2).width)+18;
    const bx=clamp(x-w/2,L,R-w);c.fillStyle='rgba(10,16,36,.95)';c.strokeStyle='rgba(148,163,184,.3)';
    c.beginPath();if(c.roundRect)c.roundRect(bx,T,w,38,9);else c.rect(bx,T,w,38);c.fill();c.stroke();
    c.fillStyle='#eef2ff';c.textAlign='center';c.fillText(s1,bx+w/2,T+16);c.fillStyle='#94a0c6';c.font='11px Inter,system-ui';c.fillText(s2,bx+w/2,T+31);
  }
  if(!cv._bound){cv._bound=true;
    const mv=e=>{const rr=cv.getBoundingClientRect();cv._hover=e.clientX-rr.left;drawLine(cv,cv._pts,cv._opt);};
    cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',mv);
    cv.addEventListener('pointerleave',()=>{cv._hover=null;drawLine(cv,cv._pts,cv._opt);});
  }
}
function spark(i){
  const d=dayOf(now()),vals=[];for(let k=d-30;k<d;k++)vals.push(closeP(i,k));vals.push(priceAt(i,now()));
  const mn=Math.min(...vals),mx=Math.max(...vals),w=84,h=30,col=vals[vals.length-1]>=vals[0]?'#22c55e':'#f43f5e';
  const pt=vals.map((v,k)=>(k*w/(vals.length-1)).toFixed(1)+','+(h-2-(h-4)*(v-mn)/((mx-mn)||1)).toFixed(1));
  return'<svg class="spark" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pt.join(' ')+' '+w+','+h+' 0,'+h+'" fill="'+col+'" fill-opacity=".12" stroke="none"/><polyline points="'+pt.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linejoin="round"/></svg>';
}
function riskHtml(n){let s='<span class="risk" title="Risiko '+n+' von 5">';for(let k=1;k<=5;k++)s+='<i class="'+(k<=n?'on':'')+'"></i>';return s+'</span>';}
function donut(parts){
  const tot=parts.reduce((a,p)=>a+p.v,0)||1,R=42,C=2*Math.PI*R;let off=0,s='';
  parts.forEach(p=>{const len=p.v/tot*C;if(len<0.3)return;s+='<circle r="'+R+'" cx="60" cy="60" fill="none" stroke="'+p.c+'" stroke-width="16" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';off+=len;});
  return'<svg viewBox="0 0 120 120" width="130" height="130"><circle r="'+R+'" cx="60" cy="60" fill="none" stroke="rgba(148,163,184,.12)" stroke-width="16"/>'+s+'</svg>';
}

/* ================================================================ Nachrichten-Ticker */
function renderTicker(){
  const el=$('#ticker');if(!el)return;const d=dayOf(now()),items=[];
  for(let k=d-1;k>=d-12;k--){
    ensure(k);const sh=SHOCK[k+HIST];
    if(sh<-0.03)items.push('📉 Tag '+k+': Börsenbeben! Fast alle Kurse fallen deutlich.');
    if(sh>0.02)items.push('📈 Tag '+k+': Jubel an der Börse – die Kurse steigen fast überall.');
    ASSETS.forEach((a,i)=>{const r=closeP(i,k)/closeP(i,k-1)-1,s=a.vol/Math.sqrt(YEAR);
      if(Math.abs(r)>2.6*s&&Math.abs(r)>0.02)items.push((r>0?'🟢 ':'🔴 ')+a.icon+' '+a.name+' '+fmtP(r)+' an Tag '+k+(r>0?' – Anleger freuen sich':' – Anleger sind nervös'));});
  }
  if(!items.length)items.push('😌 Ruhige Börse – Zeit, über deine Strategie nachzudenken.');
  items.push('💡 Tipp: Wer sein Geld auf viele Firmen verteilt, schläft ruhiger.','⏱️ Ein Spieltag dauert 5 Minuten – Geduld zahlt sich oft aus.');
  const h=items.slice(0,14).map(x=>'<span>'+esc(x)+'</span>').join('');el.innerHTML=h+h;
}

function viewAktie(){
  const s=S.arg,i=IDX[s],a=ASSETS[i],t=now(),d=dayOf(t),own=ST.holdings[s],p=path(i,d),fr=Math.floor(fracOf(t)*TICKS);
  let hi=closeP(i,d-1),lo=hi;for(let j=0;j<=fr;j++){const v=Math.exp(p[j]);hi=Math.max(hi,v);lo=Math.min(lo,v);}

function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function earnToday(){return ST.earn.date===todayKey()?ST.earn.sum:0;}
function letters(x){return norm(x).replace(/[^\p{L}]/gu,'');}
// Gibt einen Grund zurück, warum ein Vokabelpaar kein Geld bringen darf – oder '' wenn alles ok ist.
function vocabProblem(a,b){
  const la=letters(a),lb=letters(b);
  if(la.length<2||lb.length<2)return'zu kurz (mindestens 2 Buchstaben auf beiden Seiten)';
  if(la===lb||lev(la,lb)<=1)return'Wort und Übersetzung sind (fast) gleich';
  if(/^(.)\1+$/.test(la)||/^(.)\1+$/.test(lb))return'kein echtes Wort';
  return'';
}
const pairKey=it=>[letters(it.a),letters(it.b)].sort().join('|');
function giveReward(wid){
  const e=ST.earn;if(e.date!==todayKey()){e.date=todayKey();e.sum=0;e.words={};}
  if(e.sum>=DAILY_CAP)return{amt:0,why:'cap'};
  const n=e.words[wid]||0;if(n>=PER_WORD)return{amt:0,why:'word'};
  const amt=Math.min(REWARD,DAILY_CAP-e.sum);e.sum+=amt;e.words[wid]=n+1;ST.cash+=amt;
  ST.tx.push({t:now(),type:'quiz',amount:amt});return{amt};
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Laden fehlgeschlagen'));document.head.appendChild(s);});}
function downscale(file,max){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res({blob:b,url:c.toDataURL('image/jpeg',0.8)}):rej(new Error('Bild konnte nicht gelesen werden')),'image/jpeg',0.88);};img.onerror=()=>rej(new Error('Bild konnte nicht gelesen werden'));img.src=url;});}
async function getSample(){
  try{if(!(window.claude&&typeof window.claude.use==='function'))return null;
    const s=await Promise.race([window.claude.use('sample'),new Promise(r=>setTimeout(()=>r(null),5000))]);if(!s)return null;
    const lim=s.limits?await s.limits():null;if(lim&&!lim.images)return null;return s;}catch(_){return null;}
}
function parsePairs(text){
  const out=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    let l=line.replace(/^\s*[\d\W_]{0,4}\s*/,'').replace(/\[[^\]]*\]/g,' ').replace(/\s+\|\s+/g,'\t').trim();
    if(l.length<3||l.length>90)return;
    let parts=l.split(/\s*(?:\t|\s{2,}|\s[-–—=:→]\s|=|→|–|—)\s*/).map(x=>x.trim()).filter(Boolean);
    if(parts.length<2)return;
    const a=parts[0],b=parts.slice(1).join(', ');
    if(/[A-Za-zÄÖÜäöüß]/.test(a)&&/[A-Za-zÄÖÜäöüß]/.test(b))out.push({a,b});
  });
  return out;
}
async function recognize(file,status){
  const img=await downscale(file,1600);
  const sample=await getSample();
  if(sample){
    status('Claude liest die Vokabeln …');
    const prompt='Auf dem Bild ist eine Vokabelliste (zum Beispiel aus einem Schulbuch oder Vokabelheft). Lies alle Vokabelpaare aus. '+
      'Antworte NUR mit JSON in genau dieser Form: {"sprache":"Englisch","paare":[{"a":"Wort in der Fremdsprache","b":"deutsche Bedeutung"}]}. '+
      '"a" ist immer die Fremdsprache, "b" immer Deutsch. Lass Lautschrift, Seitenzahlen, Überschriften und Beispielsätze weg. Mehrere Bedeutungen mit Komma trennen.';
    try{
      let r=null;
      try{r=await sample.json(prompt,{images:[img.blob],modelTier:'default'});}
      catch(e1){const t=await sample(prompt,{images:[img.blob],modelTier:'default'});const m=/\{[\s\S]*\}/.exec(t&&t.text||'');r=m?JSON.parse(m[0]):null;}
      const arr=Array.isArray(r)?r:(r&&r.paare)||[];
      const pairs=arr.filter(x=>x&&x.a&&x.b).map(x=>({a:String(x.a).trim(),b:String(x.b).trim()}));
      if(pairs.length)return{pairs,lang:(r&&r.sprache)||'',img:img.url};
    }catch(e){console.warn(e);}
  }
  status('Texterkennung wird geladen …');
  if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const r=await window.Tesseract.recognize(img.blob,'eng+deu',{logger:m=>{if(m.status==='recognizing text')status('Lese Text … '+Math.round(m.progress*100)+' %');}});
  return{pairs:parsePairs(r&&r.data&&r.data.text),lang:'',img:img.url};
}

let Q=null;
function startQuiz(listId){
  const items=[],seen=new Set();let skipped=0;
  ST.vocab.lists.forEach(l=>{if(listId==='all'||l.id===listId)l.items.forEach(it=>{const k=pairKey(it);if(vocabProblem(it.a,it.b)||seen.has(k)){skipped++;return;}seen.add(k);items.push({it,list:l.name});});});
  if(!items.length)return toast(skipped?'In dieser Liste ist keine gültige Vokabel. Bearbeite sie bitte.':'Keine Vokabeln gefunden.','err',5000);
  if(skipped)toast(skipped+' doppelte oder ungültige Vokabel(n) werden übersprungen.','',4500);
  Q={listId,items,n:0,total:Math.min(10,Math.max(5,items.length)),right:0,earned:0,dir:S.ui.qdir||'mix',cur:null,answered:false,fb:null};
  nextQ();S.view='abfrage';try{history.replaceState(null,'','#abfrage');}catch(_){}setNav();renderView();

function nextQ(){
  const w=Q.items.map(x=>Math.max(0.3,1+(x.it.bad||0)*2-(x.it.ok||0)*0.3));let tot=w.reduce((a,b)=>a+b,0),r=Math.random()*tot,k=0;
  while(k<w.length-1&&(r-=w[k])>0)k++;
  if(Q.cur&&Q.items.length>1&&Q.items[k]===Q.cur.x)k=(k+1)%Q.items.length;
  const x=Q.items[k],fwd=Q.dir==='fwd'?true:Q.dir==='back'?false:Math.random()<0.5;
  Q.cur={x,ask:fwd?x.it.a:x.it.b,want:fwd?x.it.b:x.it.a,fwd};Q.answered=false;Q.fb=null;Q.last='';

function norm(s){return String(s).toLowerCase().replace(/\([^)]*\)/g,' ').replace(/^(to|the|a|an|der|die|das|ein|eine|sich|le|la|les|el|los|las|un|une)\s+/,'').replace(/[.,!?;:"'´`’]/g,'').replace(/\s+/g,' ').trim();}

  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}

const OKIND={
  buy: {ic:'📥',l:'Günstig kaufen',  side:'buy', below:true, help:'Kursheld kauft für deinen Betrag, sobald der Kurs auf den Wert fällt oder darunter.'},
  take:{ic:'💰',l:'Gewinn mitnehmen',side:'sell',below:false,help:'Kursheld verkauft, sobald der Kurs auf den Wert steigt oder darüber – so sicherst du dir Gewinn.'},
  stop:{ic:'🛡️',l:'Verlust begrenzen',side:'sell',below:true, help:'Kursheld verkauft, sobald der Kurs auf den Wert fällt oder darunter – so rutscht dein Verlust nicht weiter ab.'}
};
const MAX_ORDERS=30,ORDER_SCAN=5*86400e3;
const ordersFor=sym=>(ST&&ST.orders||[]).filter(o=>o.sym===sym);
function execOrder(o,hit){
  const a=ASSETS[IDX[o.sym]],K=OKIND[o.kind],p=hit.p;let msg,ok=false,qty=0,amt=0;
  if(K.side==='buy'){
    const v=Math.round(o.amount*100)/100;
    if(v+FEE>ST.cash+1e-9)msg='Zu wenig Bargeld (du hast '+fmtE(ST.cash)+', gebraucht: '+fmtE(v+FEE)+')';
    else{qty=v/p;ST.cash-=v+FEE;const h=ST.holdings[o.sym]||(ST.holdings[o.sym]={qty:0,cost:0});h.qty+=qty;h.cost+=v;
      ST.tx.push({t:hit.t,type:'buy',sym:o.sym,qty,price:p,amount:v,auto:1});ok=true;amt=v;
      msg='Gekauft: '+fmtQ(qty)+' Stück für '+fmtE(v)+' (Kurs '+fmtPr(p)+')';}
  }else{
    const h=ST.holdings[o.sym];
    if(!h)msg='Nichts im Depot zu verkaufen';
    else{let q=o.amount?Math.min(h.qty,o.amount/p):h.qty;if(q>=h.qty*0.9999)q=h.qty;const m=q*p;
      if(m<FEE)msg='Der Betrag ist kleiner als die Gebühr';
      else{h.cost*=1-q/h.qty;h.qty-=q;if(h.qty<1e-9)delete ST.holdings[o.sym];ST.cash+=m-FEE;
        ST.tx.push({t:hit.t,type:'sell',sym:o.sym,qty:q,price:p,amount:m,auto:1});ok=true;qty=q;amt=m;
        msg='Verkauft: '+fmtQ(q)+' Stück für '+fmtE(m-FEE)+' nach Gebühr (Kurs '+fmtPr(p)+')';
        if(!ST.holdings[o.sym])ST.orders.forEach(x=>{if(!x.done&&x!==o&&x.sym===o.sym&&OKIND[x.kind].side==='sell')x.done={t:hit.t,ok:false,msg:'Nichts mehr im Depot – Order gestrichen'};});}}
  }
  o.done={t:hit.t,p,qty,amt,ok,msg};
  const ago=now()-hit.t,title=(ok?'✅ Order ausgeführt: ':'⚠️ Order nicht ausgeführt: ')+a.name,body=msg+(ago>90e3?' – vor '+agoStr(ago):'');
  toast(title+' – '+body,ok?'ok':'err',9000);if(ok)beep();showNotif(title,body,o.sym);
}
function checkOrders(){
  if(!ST||!ST.orders||!ST.orders.length)return;
  const pend=ST.orders.filter(o=>!o.done);if(!pend.length)return;
  const t=now(),step=DAY_MS/TICKS,hits=[];
  for(const o of pend){
    const i=IDX[o.sym];if(i==null)continue;const below=OKIND[o.kind].below,ok=p=>below?p<=o.price:p>=o.price;
    const from=Math.max(o.chk||o.created||t,t-ORDER_SCAN);let hit=null;
    for(let tt=EPOCH+(Math.floor((from-EPOCH)/step)+1)*step;tt<=t;tt+=step){const p=priceAt(i,tt);if(ok(p)){hit={t:tt,p};break;}}
    if(!hit){const p=priceAt(i,t);if(ok(p))hit={t,p};}
    o.chk=t;if(hit)hits.push({o,hit});
  }
  if(!hits.length)return;
  hits.sort((x,y)=>x.hit.t-y.hit.t);
  for(const h of hits){if(!h.o.done)execOrder(h.o,h.hit);}
  save();
  if(['wecker','aktie','markt','depot'].includes(S.view)&&!document.activeElement.matches('input,textarea'))renderView();
}

  const K=OKIND[kind];if(!K||IDX[sym]==null)return toast('Bitte eine Art von Order wählen.','err');
  if(!isFinite(limit)||limit<=0)return toast('Bitte einen Kurs-Wert eingeben, z. B. 50,00','err');
  limit=Math.round(limit*10000)/10000;const cur=price(sym),own=ST.holdings[sym];
  if(K.side==='buy'){
    if(!(amount>=1))return toast('Bitte einen Betrag von mindestens 1 € eingeben.','err');
    if(amount+FEE>ST.cash+1e-9)return toast('Nicht genug Bargeld (inkl. 1 € Gebühr). Du hast '+fmtE(ST.cash)+'.','err');
    if(limit>=cur)return toast('Der Kurs liegt schon bei '+fmtPr(cur)+'. Für „Günstig kaufen“ muss dein Wert darunter liegen – sonst kaufe direkt im Markt.','err',5000);
  }else{
    if(!own)return toast('Dafür musst du diese Anlage im Depot haben.','err');
    if(kind==='take'&&limit<=cur)return toast('Der Kurs liegt schon bei '+fmtPr(cur)+'. Für „Gewinn mitnehmen“ muss dein Wert darüber liegen.','err',5000);
    if(kind==='stop'&&limit>=cur)return toast('Der Kurs liegt schon bei '+fmtPr(cur)+'. Für „Verlust begrenzen“ muss dein Wert darunter liegen.','err',5000);
    if(amount!=null&&!(amount>0))amount=null;
  }
  if(ST.orders.filter(o=>!o.done).length>=MAX_ORDERS)return toast('Du kannst höchstens '+MAX_ORDERS+' Orders gleichzeitig haben.','err');
  ST.orders.push({id:uid(),sym,kind,price:limit,amount:K.side==='buy'?Math.round(amount*100)/100:(amount?Math.round(amount*100)/100:null),created:now(),chk:now(),done:null});
  save();toast('📋 Order gespeichert: '+K.l+' bei '+fmtPr(limit),'ok');
  if(notifState()==='default')askNotif();
  renderView();
}

async function onlineAuth(reg){
  const n=($('#wname').value||'').trim(),pw=$('#wpw').value||'';
  if(!unameOk(n)){WELCOME.err='Der Name braucht 3–16 Zeichen (Buchstaben, Zahlen, _ oder -).';return renderWelcome();}
  if(pw.length<6){WELCOME.err='Das Passwort braucht mindestens 6 Zeichen.';return renderWelcome();}
  WELCOME.busy=true;WELCOME.err='';renderWelcome();
  try{if(reg){await onlineRegister(n,pw);toast('Willkommen, '+n+'! Du startest mit 10.000 €.','ok');}else await onlineLogin(n,pw);}
  catch(e){WELCOME.busy=false;WELCOME.err=fbErr(e);renderWelcome();}
}

document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='online'&&ST)saveRemote();if(!document.hidden){document.title='Kursheld – Börsen-Simulator';if(ST){checkAlerts();checkOrders();}checkUpdate(false);}});


/* ================================================================ Updates (ohne Neuinstallation) */
const VERSION='2026-11-27.2';
let updAsked=false;
async function remoteVersion(){
  try{const r=await fetch('index.html',{cache:'no-store'});if(!r.ok)return null;const tx=await r.text();const m=tx.match(/const VERSION='([^']+)'/);return m?m[1]:null;}catch(_){return null;}
}
async function checkUpdate(manual){
  const v=await remoteVersion();
  if(!v){if(manual)toast('Keine Verbindung – Prüfung nicht möglich.','err');return;}
  if(v!==VERSION){showUpdateBar(v);}
  else if(manual)toast('Du hast schon die neueste Version ✔ ('+VERSION+')','ok');
}
function showUpdateBar(v){
  if($('#updbar'))return;
  const b=document.createElement('div');b.id='updbar';
  b.innerHTML='<span>🆕 Neue Version verfügbar</span><button class="btn pri sm" data-act="doupdate">Jetzt aktualisieren</button><button class="btn sm" id="updx">Später</button>';
  document.body.appendChild(b);$('#updx').onclick=()=>b.remove();
}
async function doUpdate(){
  try{if(ST){save();if(S.mode==='online')await saveRemote();}}catch(_){}
  try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}catch(_){}
  try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}catch(_){}
  location.reload();
}
setTimeout(()=>checkUpdate(false),4000);
setInterval(()=>checkUpdate(false),10*60*1000);

/* ================================================================ Start */
async function boot(){
  if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(_){}}
  ensure(dayOf(now()));
  $('#app').innerHTML='<div class="welcome"><span class="spin"></span></div>';
  const online=await initFirebase();
  if(online){
    FB.au.onAuthStateChanged(FB.auth,async user=>{
      if(user){
        try{if(!ST||S.uid!==user.uid)await loadRemote(user);WELCOME.busy=false;startGame();}
        catch(e){WELCOME.busy=false;WELCOME.err=fbErr(e);renderWelcome();}
      }else if(!ST){renderWelcome();}
    });
  }else{
    const cur=store.get(LC),P=localProfiles();
    if(cur&&P[cur]){ST=fixState(P[cur].state);S.uid=cur;S.mode='local';startGame();}
    else renderWelcome();
  }
}
window.__kh={S,get ST(){return ST;},priceAt,worth,worthHistory,parsePairs,check,ASSETS,dayOf,closeP};
boot();
})();
